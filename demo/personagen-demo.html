<!DOCTYPE html>
<!--
  PersonaGen offline demo. Same CSS (frontend/src/index.css + App.css) and markup as the React app,
  with the backend replaced by recorded results so it runs with no server or models.

  For the example messages, emotion + confidence, the retrieved dataset reply and the empathy
  scores were recorded from the real backend (DistilRoBERTa, TF-IDF retrieval, EmpathyScorer).
  Reply texts are written samples standing in for the LLM. Other messages use the backend's
  keyword fallback for emotion, a template reply, and a JS port of the empathy scorer.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>PersonaGen</title>
<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
    'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
    sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

code {
  font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
    monospace;
}

/* Modern Design System for PersonaGen */

/* CSS Variables */
:root {
  --primary-color: #4F46E5;
  --accent-color: #22C55E;
  --background-color: #F9FAFB;
  --surface-color: #FFFFFF;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --border-color: #E5E7EB;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --border-radius: 12px;
  --transition: all 0.2s ease-in-out;
}

/* Base Styles */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
  background-color: var(--background-color);
  color: var(--text-primary);
  line-height: 1.6;
}

.App {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--background-color);
}

/* Header */
.app-header {
  background-color: var(--surface-color);
  border-bottom: 1px solid var(--border-color);
  padding: 2rem 1rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.app-header h1 {
  margin: 0;
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--primary-color);
  letter-spacing: -0.025em;
}

.app-header p {
  margin: 0.5rem 0 0 0;
  color: var(--text-secondary);
  font-size: 1.1rem;
  font-weight: 400;
}

/* Main Container */
.main-container {
  display: flex;
  flex: 1;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
  padding: 2rem 1rem;
  gap: 1.5rem;
}

/* Controls Panel */
.controls-panel {
  width: 280px;
  background-color: var(--surface-color);
  border-radius: var(--border-radius);
  padding: 1.5rem;
  box-shadow: var(--shadow-md);
  height: fit-content;
  position: sticky;
  top: 2rem;
  border: 1px solid var(--border-color);
}

.control-group {
  margin-bottom: 1.5rem;
}

.control-group:last-child {
  margin-bottom: 0;
}

.control-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 0.875rem;
}

.control-group select,
.control-group input[type="range"] {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.875rem;
  background-color: var(--surface-color);
  transition: var(--transition);
  outline: none;
}

.control-group select:focus,
.control-group input[type="range"]:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.control-group button {
  background-color: var(--primary-color);
  color: white;
  border: none;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  margin-right: 0.5rem;
  transition: var(--transition);
  outline: none;
}

.control-group button:hover:not(:disabled) {
  background-color: #4338CA;
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.control-group button:active:not(:disabled) {
  transform: translateY(0);
}

.control-group button:disabled {
  background-color: #9CA3AF;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Metrics */
.metrics {
  background-color: #F3F4F6;
  border-radius: 8px;
  padding: 1rem;
  margin-top: 1rem;
  border: 1px solid var(--border-color);
}

.metrics h3 {
  margin: 0 0 0.75rem 0;
  color: var(--text-primary);
  font-size: 0.875rem;
  font-weight: 600;
}

.metrics p {
  margin: 0.5rem 0;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

/* Status */
.status {
  padding: 0.75rem;
  border-radius: 8px;
  text-align: center;
  font-size: 0.75rem;
  font-weight: 600;
  margin-top: 1rem;
  border: 1px solid transparent;
  transition: var(--transition);
}

.status.ready {
  background-color: #F0FDF4;
  color: #166534;
  border-color: #BBF7D0;
}

.status.loading {
  background-color: #FFFBEB;
  color: #92400E;
  border-color: #FDE68A;
}

.status.error {
  background-color: #FEF2F2;
  color: #991B1B;
  border-color: #FECACA;
}

/* Chat Container */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background-color: var(--surface-color);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid var(--border-color);
}

/* Messages Container */
.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  min-height: 400px;
}

/* Welcome Message */
.welcome-message {
  text-align: center;
  padding: 3rem 2rem;
  color: var(--text-secondary);
}

.welcome-message h2 {
  color: var(--text-primary);
  margin-bottom: 1rem;
  font-size: 1.5rem;
  font-weight: 600;
}

.welcome-message p {
  margin: 0.5rem 0;
  font-size: 0.875rem;
  line-height: 1.5;
}

/* Messages */
.message {
  display: flex;
  margin-bottom: 0.5rem;
  animation: fadeInUp 0.3s ease-out;
}

.message.user {
  justify-content: flex-end;
}

.message.bot {
  justify-content: flex-start;
}

.message.error {
  justify-content: center;
}

.message-content {
  max-width: 70%;
  padding: 1rem 1.25rem;
  border-radius: var(--border-radius);
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.message.user .message-content {
  background-color: var(--primary-color);
  color: white;
  border-bottom-right-radius: 4px;
}

.message.user .message-content:hover {
  background-color: #4338CA;
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.message.bot .message-content {
  background-color: #F3F4F6;
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border-color);
}

.message.bot .message-content:hover {
  background-color: #F9FAFB;
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.message.error .message-content {
  background-color: #FEF2F2;
  color: #991B1B;
  border: 1px solid #FECACA;
}

.message-content strong {
  display: block;
  margin-bottom: 0.5rem;
  font-size: 0.875rem;
  font-weight: 600;
}

.message-content p {
  margin: 0;
  line-height: 1.5;
  word-wrap: break-word;
  font-size: 0.875rem;
}

.timestamp {
  font-size: 0.75rem;
  opacity: 0.7;
  margin-top: 0.5rem;
  display: block;
}

/* Message Metadata */
.message-metadata {
  margin-top: 0.75rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.metadata-item {
  display: flex;
  align-items: center;
}

.emotion-badge {
  padding: 0.25rem 0.5rem;
  border-radius: 12px;
  font-size: 0.75rem;
  color: white;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.empathy-score {
  font-size: 0.75rem;
  font-weight: 600;
}

.retry-count {
  font-size: 0.75rem;
  color: var(--text-secondary);
  background-color: #F3F4F6;
  padding: 0.25rem 0.5rem;
  border-radius: 12px;
  border: 1px solid var(--border-color);
}

.context-used,
.retrieval-used {
  font-size: 0.75rem;
  color: var(--accent-color);
  font-weight: 600;
}

.retrieved-context {
  font-size: 0.75rem;
  color: var(--text-secondary);
  background-color: #F3F4F6;
  padding: 0.25rem 0.5rem;
  border-radius: 12px;
  font-style: italic;
  border: 1px solid var(--border-color);
}

/* Typing Indicator */
.typing-indicator {
  display: flex;
  gap: 0.25rem;
  padding: 0.75rem 0;
}

.typing-indicator span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--text-secondary);
  animation: typing 1.4s infinite ease-in-out;
}

.typing-indicator span:nth-child(1) {
  animation-delay: -0.32s;
}

.typing-indicator span:nth-child(2) {
  animation-delay: -0.16s;
}

@keyframes typing {
  0%, 80%, 100% {
    transform: scale(0.8);
    opacity: 0.5;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Input Container */
.input-container {
  display: flex;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border-color);
  background-color: var(--surface-color);
}

.input-container textarea {
  flex: 1;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
  resize: none;
  font-family: inherit;
  outline: none;
  transition: var(--transition);
  background-color: var(--surface-color);
  min-height: 44px;
  max-height: 120px;
}

.input-container textarea:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.input-container textarea:disabled {
  background-color: #F9FAFB;
  cursor: not-allowed;
  opacity: 0.6;
}

.input-container button {
  background-color: var(--primary-color);
  color: white;
  border: none;
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  transition: var(--transition);
  white-space: nowrap;
  outline: none;
  min-width: 80px;
}

.input-container button:hover:not(:disabled) {
  background-color: #4338CA;
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.input-container button:active:not(:disabled) {
  transform: translateY(0);
}

.input-container button:disabled {
  background-color: #9CA3AF;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Responsive Design */
@media (max-width: 768px) {
  .main-container {
    flex-direction: column;
    padding: 1rem 0.5rem;
    gap: 1rem;
  }
  
  .controls-panel {
    width: 100%;
    position: static;
    margin-bottom: 0;
  }
  
  .message-content {
    max-width: 85%;
  }
  
  .app-header {
    padding: 1.5rem 1rem;
  }
  
  .app-header h1 {
    font-size: 2rem;
  }
  
  .app-header p {
    font-size: 1rem;
  }
}

@media (max-width: 480px) {
  .app-header {
    padding: 1rem;
  }
  
  .app-header h1 {
    font-size: 1.75rem;
  }
  
  .app-header p {
    font-size: 0.875rem;
  }
  
  .main-container {
    padding: 0.5rem;
  }
  
  .message-content {
    max-width: 90%;
    padding: 0.75rem 1rem;
  }
  
  .message-metadata {
    flex-direction: column;
    gap: 0.25rem;
  }
  
  .input-container {
    padding: 0.75rem 1rem;
    gap: 0.5rem;
  }
  
  .input-container textarea {
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
  }
  
  .input-container button {
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    min-width: 60px;
  }
}

/* Scrollbar Styling */
.messages-container::-webkit-scrollbar {
  width: 6px;
}

.messages-container::-webkit-scrollbar-track {
  background: transparent;
}

.messages-container::-webkit-scrollbar-thumb {
  background: #D1D5DB;
  border-radius: 3px;
}

.messages-container::-webkit-scrollbar-thumb:hover {
  background: #9CA3AF;
}

</style>
</head>
<body>
<div id="root">
<div class="App">
  <header class="app-header">
    <h1>PersonaGen</h1>
    <p>Emotion-aware conversational AI</p>
  </header>

  <div class="main-container">
    <div class="controls-panel">
      <div class="control-group">
        <label for="persona">Persona:</label>
        <select id="persona">
          <option value="therapist">Therapist</option>
          <option value="friendly" selected>Friendly</option>
          <option value="professional">Professional</option>
        </select>
      </div>

      <div class="control-group">
        <label for="threshold" id="thresholdLabel">Empathy Threshold: 0.20</label>
        <input id="threshold" type="range" min="0.1" max="1.0" step="0.1" value="0.2" />
      </div>

      <div class="control-group">
        <button id="clearChat">Clear Chat</button>
        <button id="clearMemory">Clear Memory</button>
      </div>

      <div class="metrics" id="metrics"></div>

      <div class="status ready">Backend Ready</div>
    </div>

    <div class="chat-container">
      <div class="messages-container" id="messages"></div>

      <div class="input-container">
        <textarea id="input" placeholder="Type your message here..." rows="2"></textarea>
        <button id="send" disabled>Send</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const EXAMPLES = [
 {
  "message": "I failed my driving test again today and I feel like a total failure",
  "emotion": "sadness",
  "confidence": 0.9914,
  "attempts": [
   {
    "reply": "Driving tests can be tricky. Most people need a few attempts. You can book another one soon.",
    "score": 0.0
   },
   {
    "reply": "I'm so sorry, that sounds really discouraging, especially after all the effort you put in. Failing a test doesn't make you a failure, even though I understand it can feel that way right now. Lots of good drivers needed more than one try. Do you know what tripped you up this time?",
    "score": 0.329
   }
  ],
  "retrieved": "Oh no, I am so sorry. How long do you have to wait to take it again?"
 },
 {
  "message": "My mom said she was disappointed in me",
  "emotion": "sadness",
  "confidence": 0.8182,
  "attempts": [
   {
    "reply": "That must have hurt to hear, especially on a day that was already so hard after the test. I understand why it stings; we want the people we love to be in our corner. Her disappointment is about one result, not about who you are. Would it help to talk about what you wish she had said instead?",
    "score": 0.282
   }
  ],
  "retrieved": "Oh no, I am so sorry. How long do you have to wait to take it again?"
 },
 {
  "message": "But I just found out I can retake it next week!",
  "emotion": "surprise",
  "confidence": 0.8474,
  "attempts": [
   {
    "reply": "That's great news! It sounds like a real relief after such a rough day. A week is enough time to practise the parts that felt shaky without losing momentum. I'm glad you have another shot so soon. How are you feeling about it now?",
    "score": 0.282
   }
  ],
  "retrieved": "Ooh how nice! Do you have any guesses as to what she may be making you?"
 },
 {
  "message": "My dog died yesterday and the house feels so empty",
  "emotion": "sadness",
  "confidence": 0.9911,
  "attempts": [
   {
    "reply": "I'm so sorry. Losing a dog is losing a family member, and it makes sense that the house feels empty without him. Those everyday moments, like being greeted at the door, are often what we miss most. It sounds like you loved him very much. Would you like to tell me about him?",
    "score": 0.323
   }
  ],
  "retrieved": "Oh I am sorry to hear that, how old was it?"
 },
 {
  "message": "I'm really nervous about my job interview tomorrow",
  "emotion": "fear",
  "confidence": 0.9948,
  "attempts": [
   {
    "reply": "It sounds like this interview really matters to you, and feeling nervous is completely understandable. Nerves often mean you care. It might help to prepare two or three stories about your work that you can adapt to different questions. What part of the interview worries you most?",
    "score": 0.504
   }
  ],
  "retrieved": "Are you nervous?"
 },
 {
  "message": "My roommate ate my food again without asking. I'm furious.",
  "emotion": "anger",
  "confidence": 0.9913,
  "attempts": [
   {
    "reply": "That sounds really frustrating, and I understand why you're angry. It isn't just about the food, it's about feeling disrespected in your own home, especially when it keeps happening. Your feelings are valid. Would it help to think through how to bring it up with them calmly?",
    "score": 0.334
   }
  ],
  "retrieved": "They probably deserve it but you know the old saying two wrongs don't make a right."
 }
];

/* ---------- state (mirrors App.js) ---------- */
let messages = [];
let memory = [];          // backend session memory (max 5 turns)
let isLoading = false;

const $ = id => document.getElementById(id);
const els = { messages: $("messages"), input: $("input"), send: $("send"), persona: $("persona"),
  threshold: $("threshold"), thresholdLabel: $("thresholdLabel"), metrics: $("metrics") };

/* ---------- helpers copied from App.js ---------- */
const getEmotionColor = (emotion) => ({
  joy: "#22C55E", sadness: "#3B82F6", anger: "#EF4444", fear: "#F59E0B",
  surprise: "#8B5CF6", disgust: "#6B7280", neutral: "#6B7280" }[emotion] || "#6B7280");
const getEmpathyColor = (score) => score >= 0.8 ? "#22C55E" : score >= 0.6 ? "#F59E0B" : "#EF4444";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const now = () => new Date().toLocaleTimeString();

/* ---------- "backend": recorded results + fallbacks ported from Python ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
const KEYWORDS = {
  sadness: ["failure", "useless", "sad", "tired", "depressed", "lonely", "hopeless", "cry", "crying"],
  anger: ["angry", "hate", "frustrated", "annoyed", "mad", "pissed", "irritated", "furious"],
  fear: ["scared", "afraid", "anxious", "worried", "nervous", "panic", "terrified"],
  joy: ["happy", "excited", "joy", "glad", "pleased", "delighted", "cheerful"] };
function ruleEmotion(t) {
  t = t.toLowerCase();
  for (const [e, ws] of Object.entries(KEYWORDS)) if (ws.some(w => t.includes(w))) return [e, 0.7];
  return ["neutral", 0.5];
}
const EMPATHY = ["understand", "feel", "sorry", "care", "support", "listen", "empathize", "compassion", "difficult", "hard",
  "struggle", "experience", "going through", "must be", "sounds like", "imagine", "appreciate", "validate", "acknowledge"];
const SUPPORT = ["help", "here for you", "together", "guidance", "advice", "suggestions", "resources", "options", "solutions", "assist"];
const EMOTIONAL = ["sad", "happy", "angry", "frustrated", "anxious", "worried", "excited", "proud", "disappointed", "confused", "overwhelmed"];
function empathyScore(user, resp, emo) {   // port of utils.EmpathyScorer.compute_empathy_score
  const r = resp.toLowerCase(), u = user.toLowerCase(), n = resp.split(/\s+/).filter(Boolean).length || 1;
  const emp = Math.min(EMPATHY.filter(w => r.includes(w)).length / n * 10, 1);
  let ack = r.includes(emo) ? 0.5 : 0;
  const ue = EMOTIONAL.filter(w => u.includes(w));
  if (ue.length) ack += ue.filter(w => r.includes(w)).length / ue.length * 0.5;
  ack = Math.min(ack, 1);
  const sup = Math.min(SUPPORT.filter(w => r.includes(w)).length / n * 15, 1);
  const len = n >= 10 && n <= 50 ? 1 : n < 10 ? n / 10 : Math.max(0.5, 1 - (n - 50) / 100);
  let s = emp * 0.4 + ack * 0.3 + sup * 0.2 + len * 0.1;
  if (["provide more details", "technical issue", "cannot assist", "unable to help", "not available"].some(p => r.includes(p))) s -= 0.4;
  if (!["i understand", "that sounds", "i'm sorry", "that must be", "i can see", "it sounds like"].some(p => r.includes(p))) s -= 0.3;
  return Math.max(0, Math.min(1, s));
}
const TEMPLATES = {
  sadness: "I'm sorry you're going through this. That sounds really hard, and your feelings make sense. I'm here for you. Would you like to tell me more?",
  anger: "That sounds really frustrating, and I understand why you feel that way. Do you want to talk through what happened?",
  fear: "It sounds like this is weighing on you, and feeling worried is understandable. What part feels most uncertain right now?",
  joy: "That sounds wonderful! I'm really happy for you. What are you most excited about?",
  neutral: "I understand. I'm here to listen and help however I can. Could you tell me a bit more about how you're feeling?",
  surprise: "Wow, that sounds like quite a surprise! How are you feeling about it?",
  disgust: "That sounds really unpleasant, and I understand why it bothered you. Do you want to talk about it?" };

// Same loop as main.generate_response_with_feedback (max_retries = 3)
function feedbackLoop(attempts, threshold) {
  let best = null;
  for (let i = 0; i < 3; i++) {
    const a = attempts[Math.min(i, attempts.length - 1)];
    if (!best || a.score > best.score) best = a;
    if (a.score >= threshold) return { ...best, retry_count: i };
  }
  return { ...best, retry_count: 2 };
}

function chatApi(message, persona, threshold) {
  const contextUsed = memory.length > 0;
  const ex = EXAMPLES.find(e => norm(e.message) === norm(message));
  let r;
  if (ex) {
    const best = feedbackLoop(ex.attempts, threshold);
    r = { response: best.reply, detected_emotion: ex.emotion, emotion_confidence: ex.confidence,
          empathy_score: best.score, retry_count: best.retry_count, retrieved_context: ex.retrieved };
  } else {
    const [emotion, confidence] = ruleEmotion(message);
    const reply = TEMPLATES[emotion];
    const best = feedbackLoop([{ reply, score: empathyScore(message, reply, emotion) }], threshold);
    r = { response: reply, detected_emotion: emotion, emotion_confidence: confidence,
          empathy_score: best.score, retry_count: best.retry_count, retrieved_context: null };
  }
  r.persona = persona;
  r.context_used = contextUsed;
  r.retrieval_used = !!r.retrieved_context;
  memory.push({ bot_response: r.response, emotion: r.detected_emotion, empathy_score: r.empathy_score });
  if (memory.length > 5) memory.shift();
  return new Promise(res => setTimeout(() => res(r), 1100 + r.retry_count * 600));
}

function metricsApi() {   // same formulas as GET /metrics
  const tok = s => new Set(s.toLowerCase().match(/\w+|[^\w\s]/g) || []);
  const resp = memory.map(m => m.bot_response);
  let div = 1;
  if (resp.length >= 2) {
    let tot = 0, n = 0;
    for (let i = 0; i < resp.length; i++) for (let j = i + 1; j < resp.length; j++) {
      const a = tok(resp[i]), b = tok(resp[j]);
      const inter = [...a].filter(x => b.has(x)).length, uni = new Set([...a, ...b]).size;
      tot += uni ? inter / uni : 1; n++;
    }
    div = 1 - tot / n;
  }
  return { average_empathy_score: memory.length ? memory.reduce((s, m) => s + m.empathy_score, 0) / memory.length : 0,
    total_conversations: memory.length, recent_emotions: memory.slice(-5).map(m => m.emotion), response_diversity: div };
}

/* ---------- rendering (same markup as App.js) ---------- */
function renderMetrics() {
  const m = metricsApi();
  els.metrics.innerHTML = `<h3>Conversation Metrics</h3>
    <p>Avg Empathy: ${m.average_empathy_score.toFixed(3)}</p>
    <p>Total Messages: ${m.total_conversations}</p>
    <p>Response Diversity: ${m.response_diversity.toFixed(3)}</p>
    ${m.recent_emotions.length ? `<p>Recent Emotions: ${m.recent_emotions.join(", ")}</p>` : ""}`;
}

function renderMessages() {
  let html = "";
  if (messages.length === 0) html += `<div class="welcome-message">
      <h2>Welcome to PersonaGen</h2>
      <p>I'm an emotionally intelligent chatbot that adapts my responses based on your emotions.</p>
      <p>Try asking me something and see how I detect emotions and adjust my empathy!</p>
    </div>`;
  for (const m of messages) {
    html += `<div class="message ${m.type}"><div class="message-content">
      <strong>${m.type === "user" ? "You" : "PersonaGen"}:</strong>
      <p>${esc(m.content)}</p>
      <span class="timestamp">${m.timestamp}</span>`;
    if (m.type === "bot") {
      html += `<div class="message-metadata">
        <div class="metadata-item"><span class="emotion-badge" style="background-color: ${getEmotionColor(m.detected_emotion)}">${m.detected_emotion} (${(m.emotion_confidence * 100).toFixed(1)}%)</span></div>
        <div class="metadata-item"><span class="empathy-score" style="color: ${getEmpathyColor(m.empathy_score)}">Empathy: ${m.empathy_score.toFixed(3)}</span></div>
        ${m.retry_count > 0 ? `<div class="metadata-item"><span class="retry-count">Retries: ${m.retry_count}</span></div>` : ""}
        ${m.context_used ? `<div class="metadata-item"><span class="context-used">Context Used</span></div>` : ""}
        ${m.retrieval_used ? `<div class="metadata-item"><span class="retrieval-used">Dataset Retrieval Used</span></div>` : ""}
        ${m.retrieved_context ? `<div class="metadata-item"><span class="retrieved-context">Retrieved: ${esc(m.retrieved_context.substring(0, 50))}...</span></div>` : ""}
      </div>`;
    }
    html += `</div></div>`;
  }
  if (isLoading) html += `<div class="message bot"><div class="message-content"><strong>PersonaGen:</strong>
      <div class="typing-indicator"><span></span><span></span><span></span></div></div></div>`;
  els.messages.innerHTML = html;
  els.messages.lastElementChild?.scrollIntoView({ behavior: "smooth" });
  els.send.disabled = isLoading || !els.input.value.trim();
  els.send.textContent = isLoading ? "Sending..." : "Send";
  els.input.disabled = isLoading;
  els.persona.disabled = els.threshold.disabled = isLoading;
  $("clearChat").disabled = $("clearMemory").disabled = isLoading;
}

async function handleSendMessage() {
  const text = els.input.value;
  if (!text.trim() || isLoading) return;
  messages.push({ type: "user", content: text, timestamp: now() });
  els.input.value = "";
  isLoading = true;
  renderMessages();
  const d = await chatApi(text.trim(), els.persona.value, parseFloat(els.threshold.value));
  messages.push({ type: "bot", content: d.response, ...d, timestamp: now() });
  isLoading = false;
  renderMessages();
  renderMetrics();
  els.input.focus();
}

els.input.addEventListener("input", () => { els.send.disabled = isLoading || !els.input.value.trim(); });
els.input.addEventListener("keypress", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } });
els.send.addEventListener("click", handleSendMessage);
els.threshold.addEventListener("input", () => {
  els.thresholdLabel.textContent = `Empathy Threshold: ${parseFloat(els.threshold.value).toFixed(2)}`; });
$("clearChat").addEventListener("click", () => { messages = []; renderMessages(); });
$("clearMemory").addEventListener("click", () => { memory = []; renderMetrics(); });

renderMessages();
renderMetrics();
</script>
</body>
</html>
